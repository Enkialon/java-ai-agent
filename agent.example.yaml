# 部署用示例：复制为启动目录同级的 agent.yaml（不要把真实密钥提交进仓库）
#
# —— 分发任务 ——
#   ./gradlew distFast    # Quarkus 默认 fast-jar → build/dist/fast/
#   ./gradlew distUber    # 单文件 uber-jar → build/dist/uber/
#   ./gradlew distSlim    # tree-shaking uber-jar → build/dist/slim/
#   ./gradlew distJlink   # uber-jar + 精简 Java 25 → build/dist/jlink/
#
# distJlink（目标机无需安装 Java；须与构建同 OS/同架构）：
#   export DEEPSEEK_API_KEY=sk-xxx
#   cp agent.example.yaml agent.yaml
#   ./run.sh
#   # 或：./runtime/bin/java -jar app/java-ai-agent-runner.jar
#   AGENT_CONFIG=/path/to/agent.yaml ./run.sh
#   ./run.sh -Dagent.config=/path/to/agent.yaml
#   JAVA_OPTS='-Xmx512m' ./run.sh
#
# distUber / distSlim（需本机已安装 Java 25+）：
#   cd build/dist/uber && ./run.sh
#

agent:
  model:
    active: deepseek
    clients:
      stub:
        type: stub

      deepseek:
        type: deepseek
        # 推荐：只写环境变量占位，密钥放环境变量 / K8s Secret / systemd EnvironmentFile
        api-key: ${DEEPSEEK_API_KEY}
        base-url: https://api.deepseek.com
        model: deepseek-v4-flash

      openai:
        type: openai
        api-key: ${OPENAI_API_KEY:}
        base-url: https://api.openai.com/v1
        model: gpt-4o

  # 工具权限：allow | deny | ask
  # ask 时 SSE 发出 ToolApprovalRequiredEvent，客户端 POST
  #   /api/agent/session/approvals/{callId}/approve|deny
  permissions:
    bash: ask
    write: ask
    network: deny
