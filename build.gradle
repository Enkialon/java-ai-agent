plugins {
    id 'java'
}

group = 'java-ai-agent'
version = '1.0-SNAPSHOT'


dependencies {
    implementation enforcedPlatform("io.quarkus.platform:quarkus-bom:3.39.1")

    // HTTP REST + JSON + SSE
    implementation 'io.quarkus:quarkus-rest-jackson'
    implementation 'io.quarkus:quarkus-rest'
    implementation 'io.smallrye.reactive:mutiny'

    // OpenAI-compatible HTTP/SSE client（DeepSeek / OpenAI）
    implementation 'com.openai:openai-java:4.54.0'

    // agent.yaml
    implementation 'com.fasterxml.jackson.dataformat:jackson-dataformat-yaml'

    testImplementation 'io.quarkus:quarkus-junit5'
    testImplementation 'io.rest-assured:rest-assured'
    testImplementation 'io.smallrye.reactive:mutiny-test-utils'


    testImplementation platform('org.junit:junit-bom:5.10.0')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

test {
    useJUnitPlatform()
}