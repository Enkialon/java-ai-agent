<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Coding Agent</title>
  <link rel="stylesheet" href="/style.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/diff2html@3.4.48/bundles/css/diff2html.min.css" />
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div class="brand">Coding Agent</div>
      <div class="meta">
        <label class="workspace-field">
          <span>Workspace</span>
          <input id="workspaceInput" type="text" placeholder="/path/to/project" spellcheck="false" />
          <button type="button" id="bindWorkspaceBtn" class="btn ghost">Bind</button>
        </label>
        <div class="meta-item">Model: <strong id="modelLabel">—</strong></div>
        <div class="meta-item">Session: <code id="sessionLabel">—</code></div>
      </div>
      <button type="button" id="newSessionBtn" class="btn ghost">New Session</button>
    </header>

    <main class="main">
      <aside class="sidebar">
        <div class="sidebar-title">Sessions</div>
        <ul id="sessionList" class="session-list"></ul>
      </aside>

      <section class="timeline-pane">
        <div id="statusBar" class="status-bar idle">Ready</div>
        <div id="timeline" class="timeline"></div>
      </section>
    </main>

    <footer class="composer">
      <textarea
        id="promptInput"
        rows="3"
        placeholder="Tell agent what to do… (Enter 发送, Shift+Enter 换行)"
        spellcheck="false"
      ></textarea>
      <button type="button" id="sendBtn" class="btn primary">Send</button>
    </footer>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/diff@5.2.0/dist/diff.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/diff2html@3.4.48/bundles/js/diff2html.min.js"></script>
  <script src="/app.js"></script>
</body>
</html>
