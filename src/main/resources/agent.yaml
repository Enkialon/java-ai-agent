# Agent 运行配置（v1）
# api-key 支持 ${ENV} / ${ENV:default}；也可留空，运行时回退到环境变量。

agent:
  model:
    # 选用 clients 下的实例名
    active: deepseek
    clients:
      stub:
        type: stub

      deepseek:
        type: deepseek
        api-key: ${DEEPSEEK_API_KEY}
        base-url: https://api.deepseek.com
        model: deepseek-v4-flash
  # 工具权限：allow | deny | ask（ask 时 SSE 推送审批事件，需 POST approve/deny）
  # bash → bash 工具；write → write/edit 工具；network 预留
  permissions:
    bash: ask
    write: ask
    network: deny
